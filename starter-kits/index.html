<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Main To Scale starter kits — Every massive system started as 5 lines of code."
    />
    <meta name="theme-color" content="#0B1020" />
    <title>Main To Scale — Developer Starter Kits</title>
    <style>
      :root {
        --bg: #0B1020;
        --grid: #162038;
        --surface: rgba(15, 23, 42, 0.88);
        --surface-elevated: rgba(15, 23, 42, 0.96);
        --border: #1E293B;
        --border-muted: rgba(148, 163, 184, 0.22);
        --cyan: #22D3EE;
        --emerald: #10B981;
        --text: #F8FAFC;
        --muted: #94A3B8;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        background-color: var(--bg);
        background-image:
          radial-gradient(circle at 50% -8%, rgba(34, 211, 238, 0.16), transparent 52%),
          radial-gradient(circle at 88% 12%, rgba(16, 185, 129, 0.11), transparent 40%),
          linear-gradient(to right, var(--grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        background-position: 0 0, 0 0, -1px -1px, -1px -1px;
        color: var(--text);
        font-family: var(--sans);
        line-height: 1.5;
        display: flex;
        flex-direction: column;
      }

      .container {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 40px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .hero {
        background: var(--surface);
        border: 1px solid rgba(34, 211, 238, 0.22);
        border-radius: 20px;
        padding: 22px 18px;
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 44px rgba(2, 6, 23, 0.55);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .hero-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .channel-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(16, 185, 129, 0.42);
        background: rgba(16, 185, 129, 0.11);
        color: #A7F3D0;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--emerald);
        box-shadow: 0 0 10px var(--emerald);
        flex-shrink: 0;
      }

      h1 {
        font-size: clamp(2rem, 6vw, 2.75rem);
        font-weight: 850;
        letter-spacing: -0.03em;
        line-height: 1.08;
        color: var(--text);
      }

      h1 .accent {
        background: linear-gradient(90deg, var(--cyan), var(--emerald));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .tagline {
        color: var(--muted);
        font-size: clamp(0.98rem, 2.6vw, 1.1rem);
        max-width: 60ch;
      }

      .search-wrap {
        position: relative;
        display: flex;
        align-items: center;
        margin-top: 4px;
      }

      .search-icon {
        position: absolute;
        left: 15px;
        color: var(--cyan);
        pointer-events: none;
        display: inline-flex;
        align-items: center;
      }

      .search-input {
        width: 100%;
        min-height: 50px;
        padding: 12px 46px 12px 44px;
        border-radius: 14px;
        border: 1.5px solid rgba(34, 211, 238, 0.35);
        background: rgba(11, 16, 32, 0.92);
        color: var(--text);
        font-family: var(--sans);
        font-size: 16px;
        outline: none;
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
        -webkit-appearance: none;
        appearance: none;
      }

      .search-input::placeholder {
        color: #64748B;
      }

      .search-input:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.18);
      }

      .search-input::-webkit-search-cancel-button {
        -webkit-appearance: none;
        appearance: none;
      }

      .clear-btn {
        position: absolute;
        right: 8px;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(30, 41, 59, 0.72);
        color: var(--text);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
      }

      .clear-btn.visible {
        display: inline-flex;
      }

      .clear-btn:hover {
        border-color: var(--cyan);
        color: var(--cyan);
      }

      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        min-height: 36px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(11, 16, 32, 0.85);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .chip:hover {
        border-color: rgba(34, 211, 238, 0.5);
        color: var(--text);
      }

      .chip.active {
        border-color: var(--cyan);
        background: rgba(34, 211, 238, 0.15);
        color: var(--cyan);
        box-shadow: 0 0 14px rgba(34, 211, 238, 0.22);
      }

      .result-count {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }

      .cards-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      @media (min-width: 640px) {
        .container {
          padding: 36px 24px 52px;
          gap: 26px;
        }

        .hero {
          padding: 28px 26px;
        }

        .cards-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }
      }

      .kit-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 16px;
        backdrop-filter: blur(8px);
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      }

      .kit-card.is-live {
        background: var(--surface-elevated);
        border-color: rgba(34, 211, 238, 0.55);
        box-shadow:
          0 0 0 1px rgba(16, 185, 129, 0.18),
          0 12px 32px rgba(16, 185, 129, 0.12),
          0 0 28px rgba(34, 211, 238, 0.12);
      }

      .kit-card.is-live:hover {
        transform: translateY(-2px);
        border-color: var(--cyan);
        box-shadow:
          0 0 0 1px rgba(16, 185, 129, 0.35),
          0 16px 36px rgba(34, 211, 238, 0.18);
      }

      .kit-card.is-soon {
        opacity: 0.9;
      }

      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .keyword-badge {
        display: inline-flex;
        align-items: center;
        padding: 6px 12px;
        border-radius: 10px;
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .kit-card.is-live .keyword-badge {
        color: #E0F2FE;
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.24), rgba(16, 185, 129, 0.24));
        border: 1px solid rgba(34, 211, 238, 0.72);
        box-shadow: 0 0 18px rgba(34, 211, 238, 0.38);
      }

      .kit-card.is-soon .keyword-badge {
        color: #BAE6FD;
        background: rgba(34, 211, 238, 0.09);
        border: 1px solid rgba(34, 211, 238, 0.34);
        box-shadow: 0 0 12px rgba(34, 211, 238, 0.16);
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .status-badge.live {
        color: #A7F3D0;
        background: rgba(16, 185, 129, 0.14);
        border: 1px solid rgba(16, 185, 129, 0.45);
      }

      .status-badge.soon {
        color: var(--muted);
        background: rgba(148, 163, 184, 0.09);
        border: 1px solid var(--border-muted);
      }

      .card-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .kit-title {
        font-size: 1.125rem;
        font-weight: 750;
        letter-spacing: -0.01em;
        color: var(--text);
      }

      .kit-stack {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.45;
      }

      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .btn {
        min-height: 48px;
        padding: 11px 16px;
        border-radius: 12px;
        font-family: var(--sans);
        font-size: 0.94rem;
        font-weight: 700;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }

      .btn-primary {
        flex: 1 1 180px;
        color: #06121A;
        background: linear-gradient(135deg, var(--cyan), var(--emerald));
        box-shadow: 0 8px 22px rgba(34, 211, 238, 0.25);
      }

      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 26px rgba(16, 185, 129, 0.34);
      }

      .btn-secondary {
        flex: 0 1 auto;
        color: var(--text);
        background: rgba(11, 16, 32, 0.85);
        border-color: rgba(34, 211, 238, 0.38);
      }

      .btn-secondary:hover {
        border-color: var(--cyan);
        color: var(--cyan);
      }

      .btn-disabled {
        width: 100%;
        color: #64748B;
        background: rgba(15, 23, 42, 0.65);
        border-color: var(--border);
        cursor: not-allowed;
      }

      .state-card {
        grid-column: 1 / -1;
        background: var(--surface);
        border: 1px dashed rgba(148, 163, 184, 0.35);
        border-radius: 18px;
        padding: 28px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .state-card p {
        color: var(--muted);
        max-width: 50ch;
        font-size: 0.95rem;
      }

      .state-card code {
        font-family: var(--mono);
        color: var(--cyan);
        background: rgba(34, 211, 238, 0.1);
        padding: 2px 6px;
        border-radius: 6px;
      }

      footer {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
        padding: 0 16px 28px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      footer a {
        color: var(--cyan);
        text-decoration: none;
        font-weight: 600;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <div class="hero-top">
          <span class="channel-pill" id="liveSummaryPill">
            <span class="pulse-dot" aria-hidden="true"></span>
            <span id="liveSummaryText">Loading kits…</span>
          </span>
        </div>

        <div>
          <h1 id="channelTitle">Main To <span class="accent">Scale</span></h1>
          <p class="tagline" id="channelTagline">
            Every massive system started as 5 lines of code.
          </p>
        </div>

        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            inputmode="search"
            autocomplete="off"
            spellcheck="false"
            aria-label="Filter starter kits by comment keyword or stack"
            placeholder="Search keyword: RIDE, TICKET, SCALE..."
          />
          <button
            id="clearBtn"
            class="clear-btn"
            type="button"
            aria-label="Clear search filter"
            title="Clear filter"
          >
            &times;
          </button>
        </div>

        <div class="filter-bar">
          <div class="chips" id="keywordChips" role="group" aria-label="Quick keyword filters"></div>
          <span class="result-count" id="resultCount"></span>
        </div>
      </header>

      <section class="cards-grid" id="kitsGrid" aria-live="polite"></section>
    </main>

    <footer>
      <span id="footerNote">Main To Scale · Every massive system started as 5 lines of code.</span>
      <a id="repoFooterLink" href="https://github.com/k-u-kiran01/MaintoScale-5Lines-of-main-code-to-scalable-system" target="_blank" rel="noopener noreferrer">
        GitHub Repository &rarr;
      </a>
    </footer>

    <script>
      (function () {
        const searchInput = document.getElementById("searchInput");
        const clearBtn = document.getElementById("clearBtn");
        const chipsWrap = document.getElementById("keywordChips");
        const kitsGrid = document.getElementById("kitsGrid");
        const resultCount = document.getElementById("resultCount");
        const liveSummaryText = document.getElementById("liveSummaryText");
        const channelTitle = document.getElementById("channelTitle");
        const channelTagline = document.getElementById("channelTagline");
        const footerNote = document.getElementById("footerNote");
        const repoFooterLink = document.getElementById("repoFooterLink");

        let kitsData = { REPO_BASE_URL: "", kits: [] };

        function resolveKitUrl(baseUrl, relPath) {
          const cleanRel = String(relPath || "").replace(/^\.\//, "").replace(/^\/+/, "");
          const cleanBase = String(baseUrl || "").trim().replace(/\/+$/, "");
          if (!cleanBase) {
            return relPath || "#";
          }
          if (!cleanRel) {
            return cleanBase;
          }
          return cleanBase + "/" + cleanRel;
        }

        function deriveRepoRootUrl(baseUrl) {
          const cleanBase = String(baseUrl || "").trim().replace(/\/+$/, "");
          const treeIdx = cleanBase.indexOf("/tree/");
          if (treeIdx !== -1) {
            return cleanBase.slice(0, treeIdx);
          }
          return cleanBase;
        }

        function getInitialQuery() {
          try {
            const params = new URLSearchParams(window.location.search);
            const qParam = (params.get("q") || "").trim();
            if (qParam) {
              return qParam;
            }
          } catch (_) {
            /* ignore malformed URLSearchParams */
          }
          const hash = (window.location.hash || "").replace(/^#/, "").trim();
          return hash;
        }

        function renderChannelMeta(data) {
          const channel = data.channel || {};
          const name = String(channel.name || "Main To Scale").trim();
          const tagline = String(channel.tagline || "Every massive system started as 5 lines of code.").trim();

          if (name === "Main To Scale") {
            channelTitle.innerHTML = 'Main To <span class="accent">Scale</span>';
          } else {
            channelTitle.textContent = name;
          }

          channelTagline.textContent = tagline;
          footerNote.textContent = name + " · " + tagline;

          const rootRepo = deriveRepoRootUrl(data.REPO_BASE_URL);
          if (rootRepo) {
            repoFooterLink.href = rootRepo;
          }

          const kits = Array.isArray(data.kits) ? data.kits : [];
          const liveCount = kits.filter(function (k) {
            return k.status === "live";
          }).length;
          const soonCount = kits.length - liveCount;
          const liveLabel = liveCount === 1 ? "1 KIT LIVE" : liveCount + " KITS LIVE";
          liveSummaryText.textContent = liveLabel + " · " + soonCount + " DROPPING THIS WEEK";
        }

        function updateActiveChip(query) {
          const normalized = String(query || "").trim().toUpperCase();
          const buttons = chipsWrap.querySelectorAll(".chip");
          buttons.forEach(function (btn) {
            const val = btn.getAttribute("data-keyword") || "";
            const isActive = (!normalized && val === "") || (normalized && val === normalized);
            btn.classList.toggle("active", Boolean(isActive));
          });
        }

        function renderChips(kits) {
          chipsWrap.innerHTML = "";

          function makeChip(label, value) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "chip";
            btn.setAttribute("data-keyword", value);
            btn.textContent = label;
            btn.addEventListener("click", function () {
              searchInput.value = value;
              applyFilter();
              if (value) {
                searchInput.blur();
              }
            });
            chipsWrap.appendChild(btn);
          }

          makeChip("ALL", "");
          kits.forEach(function (kit) {
            const kw = String(kit.keyword || "").toUpperCase();
            if (kw) {
              makeChip(kw, kw);
            }
          });
        }

        function buildKitCard(kit, repoBaseUrl) {
          const isLive = kit.status === "live";

          const card = document.createElement("article");
          card.className = "kit-card " + (isLive ? "is-live" : "is-soon");

          const top = document.createElement("div");
          top.className = "card-top";

          const keywordBadge = document.createElement("span");
          keywordBadge.className = "keyword-badge";
          keywordBadge.textContent = String(kit.keyword || "").toUpperCase();

          const statusBadge = document.createElement("span");
          statusBadge.className = "status-badge " + (isLive ? "live" : "soon");
          statusBadge.textContent = isLive ? "● LIVE" : "Coming Soon";

          top.appendChild(keywordBadge);
          top.appendChild(statusBadge);

          const body = document.createElement("div");
          body.className = "card-body";

          const title = document.createElement("h2");
          title.className = "kit-title";
          title.textContent = String(kit.title || "");

          const stack = document.createElement("p");
          stack.className = "kit-stack";
          stack.textContent = String(kit.stack || "");

          body.appendChild(title);
          body.appendChild(stack);

          const actions = document.createElement("div");
          actions.className = "card-actions";

          if (isLive) {
            const primary = document.createElement("a");
            primary.className = "btn btn-primary";
            primary.href = resolveKitUrl(repoBaseUrl, kit.path);
            primary.target = "_blank";
            primary.rel = "noopener noreferrer";
            primary.textContent = String(kit.cta || "Open Starter Kit →");
            actions.appendChild(primary);

            if (kit.zip) {
              const zipLink = document.createElement("a");
              zipLink.className = "btn btn-secondary";
              zipLink.href = String(kit.zip);
              zipLink.setAttribute("download", "");
              zipLink.textContent = "Download .zip";
              actions.appendChild(zipLink);
            }
          } else {
            const disabledBtn = document.createElement("button");
            disabledBtn.type = "button";
            disabledBtn.className = "btn btn-disabled";
            disabledBtn.disabled = true;
            disabledBtn.textContent = "Dropping This Week";
            actions.appendChild(disabledBtn);
          }

          card.appendChild(top);
          card.appendChild(body);
          card.appendChild(actions);
          return card;
        }

        function renderCards(query) {
          const allKits = Array.isArray(kitsData.kits) ? kitsData.kits : [];
          const q = String(query || "").trim().toLowerCase();

          const filtered = !q
            ? allKits
            : allKits.filter(function (kit) {
                const haystack = [kit.keyword, kit.title, kit.stack]
                  .join(" ")
                  .toLowerCase();
                return haystack.indexOf(q) !== -1;
              });

          kitsGrid.innerHTML = "";
          resultCount.textContent = filtered.length + " of " + allKits.length + " kits";

          if (filtered.length === 0) {
            const empty = document.createElement("div");
            empty.className = "state-card";

            const heading = document.createElement("h2");
            heading.className = "kit-title";
            heading.textContent = 'No starter kit matched "' + String(query || "").trim() + '"';

            const copy = document.createElement("p");
            copy.textContent = "Try a Short comment keyword like RIDE, TICKET, SCALE, GIT, CHAT, STREAM, AUDIO, or LIMIT.";

            const resetBtn = document.createElement("button");
            resetBtn.type = "button";
            resetBtn.className = "btn btn-secondary";
            resetBtn.textContent = "Show all kits";
            resetBtn.addEventListener("click", function () {
              searchInput.value = "";
              applyFilter();
            });

            empty.appendChild(heading);
            empty.appendChild(copy);
            empty.appendChild(resetBtn);
            kitsGrid.appendChild(empty);
            return;
          }

          filtered.forEach(function (kit) {
            kitsGrid.appendChild(buildKitCard(kit, kitsData.REPO_BASE_URL));
          });
        }

        function applyFilter() {
          const val = searchInput.value;
          clearBtn.classList.toggle("visible", val.trim().length > 0);
          updateActiveChip(val);
          renderCards(val);
        }

        function renderLoadError(err) {
          liveSummaryText.textContent = "Unable to load kits.json";
          kitsGrid.innerHTML = "";

          const card = document.createElement("div");
          card.className = "state-card";

          const title = document.createElement("h2");
          title.className = "kit-title";
          title.textContent = "Could not load starter kit catalog";

          const msg = document.createElement("p");
          msg.innerHTML =
            "If you opened this file directly via <code>file://</code>, browser security blocks <code>fetch('./kits.json')</code>. Serve it via GitHub Pages or run <code>python -m http.server</code> inside <code>starter-kits/</code>.";

          const detail = document.createElement("p");
          detail.textContent = String(err && err.message ? err.message : err);

          card.appendChild(title);
          card.appendChild(msg);
          card.appendChild(detail);
          kitsGrid.appendChild(card);
        }

        searchInput.addEventListener("input", applyFilter);
        clearBtn.addEventListener("click", function () {
          searchInput.value = "";
          applyFilter();
          searchInput.focus();
        });

        fetch("./kits.json", { cache: "no-store" })
          .then(function (resp) {
            if (!resp.ok) {
              throw new Error("HTTP " + resp.status + " loading kits.json");
            }
            return resp.json();
          })
          .then(function (data) {
            kitsData = data;
            renderChannelMeta(data);
            renderChips(Array.isArray(data.kits) ? data.kits : []);

            const initial = getInitialQuery();
            if (initial) {
              searchInput.value = initial;
            }
            applyFilter();
          })
          .catch(renderLoadError);
      })();
    </script>
  </body>
</html>
